[package]
name = "pad"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# Runs the plugin as a program, for working on the editor without a DAW:
# cargo run -p pad --features standalone
[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "pad_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
suite_common = { workspace = true }

[dev-dependencies]
hound = "3.5"
