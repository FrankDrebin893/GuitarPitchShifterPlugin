[package]
name = "drums"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# Runs the plugin as a program, for working on the editor without a DAW:
# cargo run -p drums --features standalone
[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "drums_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
suite_common = { workspace = true }

[dev-dependencies]
hound = "3.5"
# Reads a drum part for render_wavs. In tests only: no plugin ships with it
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
