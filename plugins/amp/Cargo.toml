[package]
name = "amp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# Runs the plugin as a program, for working on the editor without a DAW:
# cargo run -p amp --features standalone
[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "amp_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
suite_common = { workspace = true }

[dev-dependencies]
hound = "3.5"
