[workspace]
resolver = "2"
members = ["xtask", "crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rasmus Højte"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }
suite_common = { path = "crates/suite_common" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Lints that clash with how DSP code is written here. Every crate takes these (`[lints]`).
[workspace.lints.clippy]
# Filter coefficients and polynomial fits are kept to the digits they were designed with;
# changing one changes the output's bits
excessive_precision = "allow"
approx_constant = "allow"
# DSP loops index several buffers with one counter
needless_range_loop = "allow"
# Noise generators have a `next` that never ends, so they are not iterators
should_implement_trait = "allow"
