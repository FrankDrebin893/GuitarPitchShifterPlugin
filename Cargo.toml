[workspace]
resolver = "2"
members = ["xtask", "crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rasmus Højte"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Our fork: upstream 28b149e plus one commit, `Vst3Plugin::VST3_INFINITE_TAIL` (branch
# hojt-vst3-infinite-tail; tag hojt-1 keeps the commit, never delete it). VST3 hosts that
# read the tail length once, before the first block, would otherwise see 0 and may cut
# delay and reverb tails (#20)
nih_plug = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "b122ba697d363f3035545e6ed7d2b8466a8864d8" }
nih_plug_egui = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "b122ba697d363f3035545e6ed7d2b8466a8864d8" }
nih_plug_xtask = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "b122ba697d363f3035545e6ed7d2b8466a8864d8" }
suite_common = { path = "crates/suite_common" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Lints that clash with how DSP code is written here. Every crate takes these (`[lints]`).
[workspace.lints.clippy]
# Filter coefficients and polynomial fits are kept to the digits they were designed with;
# changing one changes the output's bits
excessive_precision = "allow"
approx_constant = "allow"
# DSP loops index several buffers with one counter
needless_range_loop = "allow"
# Noise generators have a `next` that never ends, so they are not iterators
should_implement_trait = "allow"
