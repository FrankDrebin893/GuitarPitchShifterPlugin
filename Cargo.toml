[workspace]
members = ["xtask"]

[package]
name = "transpose_plugin"
version = "0.1.0"
edition = "2021"
authors = ["Transpose Plugin"]
license-file = "LICENSE"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
